name: Plugin SDK and packages
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plugins:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          if ($LASTEXITCODE -ne 0) { throw 'Rust install failed' }
      - name: Test plugin contract and examples
        run: |
          cargo test --locked --workspace --exclude still-island
          if ($LASTEXITCODE -ne 0) { throw 'Plugin tests failed' }
      - name: Build separate plugin packages
        run: ./scripts/package-plugins.ps1
      - name: Smoke test separate plugin processes
        run: python scripts/plugin-smoke.py --binary-dir target/plugin-build/x86_64-pc-windows-msvc/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: trusted-plugin-examples-windows-x64
          path: |
            target/plugin-packages/*.zip
            target/plugin-packages/SHA256SUMS
          if-no-files-found: error
