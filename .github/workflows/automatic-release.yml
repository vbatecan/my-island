name: Automatic release
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: automatic-release
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/windows-ci.yml
  version:
    needs: checks
    runs-on: windows-2022
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Install stable Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          if ($LASTEXITCODE) { throw 'Rust installation failed' }
          rustup default stable
          if ($LASTEXITCODE) { throw 'Rust selection failed' }
      - id: prepare
        shell: pwsh
        run: ./scripts/prepare-auto-release.ps1
  release:
    needs: version
    uses: ./.github/workflows/windows-release.yml
    with:
      release_tag: ${{ needs.version.outputs.tag }}
    permissions:
      contents: write
    secrets: inherit
