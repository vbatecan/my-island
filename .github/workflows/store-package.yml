name: Microsoft Store package
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or release tag to package
        required: true
        default: main
        type: string
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE) { throw 'Rust installation failed' }
          rustup default stable
          if ($LASTEXITCODE) { throw 'Rust selection failed' }
      - name: Check the selected source
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE) { throw 'Formatting failed' }
          cargo check --workspace --locked
          if ($LASTEXITCODE) { throw 'Type checking failed' }
          cargo test --workspace --locked
          if ($LASTEXITCODE) { throw 'Tests failed' }
      - name: Build Store MSIX
        run: ./scripts/package.ps1 -Store
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: microsoft-store-package
          path: |
            target/store/*_store.msix
            target/store/package-audit.json
          if-no-files-found: error
          retention-days: 30
