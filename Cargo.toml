[package]
name = "still-island"
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
description = "A quiet native Windows island with interruptible spring motion"
license = "MIT"

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "compat-1-2", "raw-window-handle-06", "unstable-winit-030"] }
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows-core = "0.62.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Controls", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_RemoteDesktop", "UI_Notifications_Management", "UI_Notifications", "ApplicationModel", "Security_Authorization_AppCapabilityAccess", "Win32_Storage_Packaging_Appx", "Win32_Graphics_Dwm", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_Devices_FunctionDiscovery", "Win32_UI_Shell_PropertiesSystem", "Foundation", "Media_Control", "Storage_Streams", "Win32_System_WinRT", "Win32_System_Variant", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture"] }

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"


